apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-web-html
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <title>Garage of Experiments</title>
        <style>
            body {
                background-color: blue;
                color: white;
                font-family: Arial, sans-serif;
                text-align: center;
                padding-top: 20%;
            }
        </style>
    </head>
    <body>
        <h1>Welcome to Garage of experiments</h1>
        <p>Version: 2.0 (Blue)</p>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage-web-deployment
  labels:
    app: garage-web
spec:
  replicas: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  selector:
    matchLabels:
      app: garage-web
  template:
    metadata:
      labels:
        app: garage-web
      annotations:
        # Putting it here forces a template change AND records the history!
        kubernetes.io/change-cause: "Switched background theme to Blue V2"
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html-volume
          mountPath: /usr/share/nginx/html
      volumes:
      - name: html-volume
        configMap:
          name: garage-web-html
---
apiVersion: v1
kind: Service
metadata:
  name: garage-web-service
spec:
  type: NodePort
  selector:
    app: garage-web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080